<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 128 128" width="128" height="128">
  <title>Alphintra</title>
  <!--
    The Alphintra mark, from the logo PNG.

    Wrapped in SVG rather than shipped as a PNG favicon on purpose. The source
    is 472x528 — portrait — and a browser drops a non-square favicon
    straight into a square slot and squashes it. A square viewBox with the
    artwork centred keeps the proportions and pads with transparency instead.

    The source also carries a wide transparent margin, which left the mark
    filling 43% of the icon; it is cropped to its alpha bounds here and refitted
    so it reads at the 16px a tab strip draws.

    The image is embedded, not linked: browsers do not fetch external references
    from inside an SVG favicon. And xlink:href, not the bare SVG2 href, because
    a standalone .svg is parsed as XML rather than as part of an HTML document.
  -->
  <image x="4.00" y="7.00" width="120" height="114"
         xlink:href="data:image/png;base64,"/>
</svg>
